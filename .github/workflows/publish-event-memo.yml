name: Publish event memo

on:
  push:
    paths:
      - 'docs/event-memos/sealed/**'
      - 'docs/event-memos/dry-runs/**'
      - 'scripts/publish_event_memo.py'
      - 'tests/test_memo_publication.py'
      - '.github/workflows/publish-event-memo.yml'
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Committed event or dummy manifest path'
        required: true
        type: string

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test price and publication boundaries
        run: |
          python3 -m unittest discover -s tests -p 'test_event_prices.py'
          python3 -m unittest discover -s tests -p 'test_memo_publication.py'
      - name: Record committed memo and GitHub server time
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MANIFEST: ${{ inputs.manifest }}
        run: |
          if [ -n "$MANIFEST" ]; then
            python3 scripts/publish_event_memo.py --manifest "$MANIFEST" --output publication/receipts.json
          else
            python3 scripts/publish_event_memo.py --output publication/receipts.json
          fi
      - name: Preserve receipt in the Memo receipts issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request

          receipts = json.loads(Path('publication/receipts.json').read_text())
          if not receipts:
              print('No new memo receipts to preserve.')
              raise SystemExit(0)
          body = '## Publication receipt\n\n```json\n' + json.dumps(receipts, indent=2) + '\n```'
          if len(body) > 60000:
              raise ValueError('Receipt exceeds the issue-comment size budget; nothing was truncated.')
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/2/comments"
          request = urllib.request.Request(
              url, data=json.dumps({'body': body}).encode(), method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'de-power-market-view-publication',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              comment = json.load(response)
          print(f"Permanent receipt: {comment['html_url']} (posted {comment['created_at']})")
          PY
      - name: Save publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memo-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: publication/receipts.json
          if-no-files-found: error
          retention-days: 90
