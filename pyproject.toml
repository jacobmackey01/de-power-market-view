[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "de-power-market-view"
version = "0.1.0"
description = "A reproducible historical negative-price risk view for the DE-LU day-ahead power market"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jacob Mackey", email = "jacobmackey01@gmail.com" }]
dependencies = [
    "duckdb>=1.3,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2.2,<3",
    "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
de-power-fetch = "de_power_market_view.fetch:main"
de-power-view = "de_power_market_view.view:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
de_power_market_view = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
